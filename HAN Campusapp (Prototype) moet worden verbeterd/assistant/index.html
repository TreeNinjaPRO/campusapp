<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HANssistent — HAN Campusapp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e70052'/%3E%3Cpath d='M9 8v16M9 16h9M18 8v16' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles/global.css" />
</head>
<body>
  <main class="page">
    <h1 class="page__title">HANssistent AI</h1>
    <p class="page__lead">Een lokale AI-assistent die volledig in je browser draait — er verlaat niets je apparaat.</p>

    <div class="assistant-shell">
      <div id="assistant-status" class="assistant-status">
        HANssistent wordt geladen…
      </div>

      <div class="assistant-mode-toggle">
        <button class="assistant-mode is-active" data-mode="assistantLLM">assistantLLM</button>
        <button class="assistant-mode" data-mode="calenderLLM">calenderLLM</button>
      </div>

      <div id="assistant-screenshot" class="assistant-screenshot" style="display:none;">
        <img id="assistant-screenshot-thumb" alt="Roosterscreenshot" />
        <div style="flex:1;">
          <p style="margin:0; font-weight:600;">Roosterscreenshot beschikbaar</p>
          <p style="margin:2px 0 0; color:rgba(23,28,24,.6);">Vastgelegd via "Add to Calender".</p>
        </div>
        <button id="analyze-schedule-btn" class="btn btn--primary btn--square">Analyseer</button>
      </div>

      <div id="assistant-log" class="assistant-log"></div>

      <form id="assistant-form" class="assistant-composer">
        <input id="assistant-input" type="text" placeholder="Typ een bericht…" autocomplete="off" />
        <button type="submit" class="btn btn--primary">Stuur</button>
      </form>
    </div>
  </main>

  <script src="/scripts/nav.js" defer></script>
  <script src="/scripts/webllm.js" defer></script>
  <script src="/scripts/assistant.js" defer></script>
</body>
</html>
