<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Locatie — HAN Campusapp</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e70052'/%3E%3Cpath d='M9 8v16M9 16h9M18 8v16' stroke='%23fff' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/styles/global.css" />
</head>
<body>
  <main class="page">
    <h1 class="page__title">Locatie</h1>
    <p class="page__lead">Zoek een campuslocatie op en bekijk hem direct op de kaart.</p>

    <div id="mapping" class="mapping">
      <div id="innermap" class="innermap">
        <span class="innermap__label" id="innermap-icon-slot">
          Locatie
        </span>
        <button id="locate-toggle" class="innermap__go btn btn--primary">🔍</button>
      </div>

      <div id="locate-box" class="locate-box">
        <input id="locate-input" type="text" placeholder='Typ een adres of plaats, bv. "Ruitenberglaan 26, Arnhem"' />
        <button id="locate-go" class="btn btn--dark btn--square">Ga</button>
        <button id="locate-save" class="btn btn--square" style="border:1px solid var(--color-line);" title="Adres opslaan">☆</button>
      </div>

      <div id="saved-addresses" class="saved-addresses"></div>

      <div style="margin-top:16px; border-radius:10px; overflow:hidden; box-shadow: var(--shadow-card);">
        <iframe
          id="map-frame"
          title="Campuskaart"
          width="100%"
          height="360"
          style="border:0; display:block;"
          src="https://www.openstreetmap.org/export/embed.html?bbox=5.9330%2C51.9800%2C5.9600%2C51.9950&layer=mapnik&marker=51.9880%2C5.9470">
        </iframe>
      </div>
    </div>
  </main>

  <script src="/scripts/nav.js" defer></script>
  <script src="/scripts/webllm.js" defer></script>
  <script src="/scripts/services.js" defer></script>
</body>
</html>
